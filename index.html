<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Games | CS2 & FURIA</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            padding: 20px;
        }

        header {
            background-color: #161a22;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff88;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
        }

        .logo span {
            color: #00ff88;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 600;
        }

        nav a:hover {
            color: #00ff88;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h2 {
            color: #00ff88;
            margin-bottom: 20px;
        }

        /* CARD DO POST */
        .post-card {
            background-color: #1a1f29;
            border: 1px solid #ff4655;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(255, 70, 85, 0.2);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .autor-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            font-size: 1.2rem;
            background: #2a3140;
            padding: 8px;
            border-radius: 50%;
        }

        .autor-info strong {
            color: #ffffff;
            display: block;
        }

        .autor-info small {
            color: #888888;
        }

        .badge-post {
            background-color: #ff4655;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .post-conteudo h3 {
            color: #00ff88;
            margin-bottom: 10px;
        }

        .post-conteudo p {
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* IMAGEM DO POST */
        .imagem-post {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #2a3140;
            margin: 10px 0;
            display: block;
        }

        .post-footer {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #2a3140;
        }

        .btn-like {
            background-color: #ff4655;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .btn-like:hover {
            background-color: #e03846;
        }

        .num-curtidas {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NEXUS<span>GAMES</span></div>
        <nav>
            <a href="#highlights">Highlights</a>
        </nav>
    </header>

    <main class="container">
        <section id="highlights">
            <h2>Destaques da Comunidade</h2>

            <article class="post-card">
                <header class="post-header">
                    <div class="autor-info">
                        <span class="avatar">🐾</span>
                        <div>
                            <strong>FURIA Esports</strong>
                            <small>Publicado há 2 horas • CS2 Major</small>
                        </div>
                    </div>
                    <span class="badge-post">🔥 EM DESTAQUE</span>
                </header>

                <div class="post-conteudo">
                    <h3>Jogadas Insanas e Clutches do Último Major!</h3>
                    <p>Confira a compilação com os melhores momentos, táticas agressivas de TR e defesas impecáveis nos palcos do e-sports mundial.</p>
                    
                    <img 
                        src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1000&q=80" 
                        alt="Arena de Campeonato de CS2" 
                        class="imagem-post"
                    >
                </div>

                <footer class="post-footer">
                    <button id="btn-curtir" class="btn-like">
                        ❤️ <span id="texto-botao">Curtir post</span>
                    </button>
                    <span id="contador-curtidas" class="num-curtidas">0 curtidas</span>
                </footer>
            </article>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let quantidadeCurtidas = 0;

            const btnCurtir = document.getElementById('btn-curtir');
            const textoContador = document.getElementById('contador-curtidas');
            const textoBotao = document.getElementById('texto-botao');

            if (btnCurtir && textoContador) {
                btnCurtir.addEventListener('click', () => {
                    quantidadeCurtidas++;

                    if (quantidadeCurtidas === 1) {
                        textoContador.textContent = "1 curtida";
                        if (textoBotao) textoBotao.textContent = "Curtido!";
                    } else {
                        textoContador.textContent = `${quantidadeCurtidas} curtidas`;
                    }
                });
            }
        });
    </script>
</body>
</html>
